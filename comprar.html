<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <title>Ferreteria - Inicio</title>
      <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
      <link rel="stylesheet" href="css/comprar.css">
      <script src="js/comprar.js" defer></script>
   </head>
   <body>
      <nav id="menu" class="navbar navbar-expand-sm navbar-white">
         <div class="container-fluid">
         <div id="logo" class="d-flex align-items-center ms-lg-5">
            <img src="img/logo.png"  style="width: 85px; height: 65px; ">
         </div>
         <a  class="position-relative me-lg-5">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               fill="currentColor" class="bi bi-cart2" viewBox="0 0 16 16">
               <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
            </svg>
            <span  id="cartContador" class="d-none position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            0
            </span>
         </a>
         <button  class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false">
         <span class="navbar-toggler-icon"></span>
         </button>
         <div  id="navbarNav" class="collapse navbar-collapse justify-content-center ms-lg-auto ">
            <ul class="navbar-nav fw-bold">
               <li class="nav-item">
                  <a class="nav-link"  href="index.html">Inicio</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link" href="contenido.html">Contenido</a>
               </li>
               <li class="nav-item">
                  <a class="nav-link me-md-2" href="contacto.html">Contacto</a>
               </li>
            </ul>
         </div>
      </nav>
      <main>
         <aside>
            <img id="banner" src="img/banner.png" >
            <div class="text-center bg-black py-2">
               <p id="bienvenido" class="text-white mb-0 py-3 fw-bold ">
                  ¡Bienvenido a Ferreteria! Tu tienda en línea para herramientas y materiales de construcción de alta calidad.
               </p>
            </div>
         </aside>
         <div class="flex" id="listaCompras">

          
         </div>
   
        
           
               <div id="flex-compra" class="card-body ">
                  <h5 class="card-title text-center mb-4">Detalle de la compra</h5>
                  <div id="detalle-compra" class="d-flex flex-column gap-3">
                     <div class="d-flex justify-content-between">
                        <span>Subtotal</span>
                        <span id="subtotal">$0.00</span>
                     </div>
                      
                     <div id="flex-envio" class="d-flex justify-content-between">
                      <div class="form-check form-switch d-flex align-items-center justify-content-center me-5">
  <input
    class="form-check-input"
    type="checkbox"
    id="envioSwitch"
    style="
      --bs-form-check-bg: #bed2f0;
      --bs-form-check-border-color: #7aa7ff;
      --bs-form-check-checked-bg-color: #2f6fff;
      --bs-form-check-checked-border-color: #2f6fff;
      --bs-form-check-focus-shadow-rgb: 47,111,255;
    "
  >
  <label class="form-check-label ms-3 mt-1 fw-semibold" for="envioSwitch">
    Envío a domicilio
  </label>
</div>


                        <span id="envio">$10.00</span>
                     </div>
                     <div id="flex-total" class="d-flex justify-content-between fw-bold">
                        <span>Total</span>
                        <span id="total">$0.00</span>
                     </div>
                  </div>
                  <div class="d-grid gap-2 mt-4">
                     <button id="btn-comprar" class="btn btn-primary" type="button">Comprar</button>
                  </div>
               </div>
         
     
      </main>
      <footer class="bg-primary text-center py-5">
         <p class="mb-0 text-white">&copy; 2025 Ferreteria.</p>
      </footer>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
